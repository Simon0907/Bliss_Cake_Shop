<div class="dashboard-container">

  <div class="welcome-card">

    <h1>
      Welcome {{username}} 👋
    </h1>

    <p>
      Manage your orders and cart here
    </p>

  </div>

  <div class="dashboard-grid">

    <!-- ORDER CARD -->

    <div class="dashboard-card">

      <h2>🧁 Order Cakes</h2>

      <p>
        Explore delicious cakes and place orders
      </p>

      <button routerLink="/orders">
        Order Now
      </button>

    </div>

    <!-- CART CARD -->

    <div class="dashboard-card">

      <h2>🛒 Your Cart</h2>

      <p>
        View items added to your cart
      </p>

      <button routerLink="/cart">
        Go To Cart
      </button>

    </div>

    <!-- PROFILE CARD -->

    <div class="dashboard-card">

      <h2>👤 Your Profile</h2>

      <p>
        Logged in as {{username}}
      </p>

      <button (click)="logout()">
        Logout
      </button>

    </div>
    <div class="dashboard-card">

<h2>📦 My Orders</h2>

<p>
Track your previous cake orders
</p>

<button routerLink="/my-orders">
View Orders
</button>

</div>

  </div>

</div>
