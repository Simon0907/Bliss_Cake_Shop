<h2 class="cart-title">Your Cart</h2>

<div *ngIf="cartService.getItems().length == 0" class="empty-cart">
Cart is empty 🛒
</div>

<div class="cart-container">

<div class="cart-item"
*ngFor="let item of cartService.getItems(); let i = index">

<img [src]="item.img">

<div class="item-details">

<h3>{{item.name}}</h3>
<p class="price">₹{{item.price}}</p>

<div class="qty-box">

<button (click)="cartService.decreaseQty(i)">−</button>

<span>{{item.quantity}}</span>

<button (click)="cartService.increaseQty(i)">+</button>

</div>

</div>

<button class="remove-btn"
(click)="cartService.removeItem(i)">
Remove
</button>

</div>

</div>

<h2 class="total">
Total: ₹{{cartService.getTotalPrice()}}
</h2>

<a routerLink="/checkout" class="checkout-btn">
Proceed To Checkout
</a>
