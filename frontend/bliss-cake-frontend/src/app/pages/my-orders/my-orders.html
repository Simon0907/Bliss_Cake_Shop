<div class="orders-page">

<h1>My Orders</h1>

<div class="order-card" *ngFor="let order of orders">

<h2>{{order.productName}}</h2>

<p>Quantity : {{order.quantity}}</p>

<p>Total : ₹{{order.totalPrice}}</p>

<p>Status :
<span class="status">
{{order.status}}
</span>
</p>

<p>Date :
{{order.orderDate | date:'medium'}}
</p>

</div>

</div>
